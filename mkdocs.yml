site_name: SFP-xSPI Bridge
site_description: >-
  Mostek OCTOSPI / QUADSPI / SPI ↔ SFP na FPGA Gowin GW1N-9: łącze światłowodowe
  punkt–punkt z kodowaniem 8b/10b i programowym odzyskiem zegara.
docs_dir: doc
use_directory_urls: true

theme:
  name: material
  language: pl
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Tryb jasny

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Start: index.md
  - Plan konstrukcji: sfp-xspi-bridge-plan.md
  - VHDL:
      - vhdl/index.md
      - Konwencje kodu: vhdl/konwencje.md
      - Symulacja i przebiegi: vhdl/symulacja.md
      - Moduły:
          - Synchronizatory (sync_bit, reset_sync): vhdl/sync.md
          - Zegary i reset (clk_rst): vhdl/clk_rst.md
          - CRC-32 (crc32): vhdl/crc32.md
          - Kod 8b/10b (enc_8b10b, dec_8b10b): vhdl/8b10b.md
          - FIFO dwuzegarowe (async_fifo): vhdl/async_fifo.md
          - Ramkowanie (tx_framer, rx_deframer): vhdl/framing.md
          - Odzysk danych (cdr_os4x8): vhdl/cdr.md
          - Wyrównanie symboli (comma_align): vhdl/comma_align.md
          - Warstwa fizyczna (tx_gearbox, tx_phy, rx_phy): vhdl/phy.md
          - Sterowanie łączem (link_ctrl): vhdl/link_ctrl.md
          - Tryb UART (uart_rx, uart_tx, uart_bridge): vhdl/uart.md
          - Interfejs hosta (xspi_slave): vhdl/xspi_slave.md
          - Rejestry (csr_regs): vhdl/csr_regs.md
          - Zarządzanie SFP (i2c_master, sfp_mgmt): vhdl/sfp_mgmt.md
          - Zegar hosta i echo ramek (host_clk, frame_echo): vhdl/host_clk.md
  - Decyzje (ADR):
      - adr/README.md
      - "0001 FPGA GW1N-9": adr/0001-fpga-gw1n-9.md
      - "0002 Terminacja RX": adr/0002-terminacja-rx-zewnetrzna.md
      - "0003 Weryfikacja GHDL": adr/0003-weryfikacja-ghdl.md
      - "0004 Strategia resetu": adr/0004-strategia-resetu.md
      - "0005 Protokół łącza": adr/0005-protokol-lacza.md
      - "0006 Tryb UART": adr/0006-tryb-uart-przezroczysty.md
      - "0007 Zegar 50 MHz": adr/0007-zegar-systemowy-50mhz.md
      - "0008 Stan łącza": adr/0008-stan-lacza.md
      - "0009 Interfejs hosta": adr/0009-interfejs-hosta.md
